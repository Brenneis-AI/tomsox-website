  File: section-main.html
  Page: Schedule
  Section: Full schedule display with season stats bar, filters, and game cards
  Last Updated: 2026-02-21
-->

<div class="schedule-page-container">

    <div class="schedule-header">
        <div class="schedule-title-section">
            <h1>Schedule</h1>
            <div class="sponsor-logo">
                <span>SPONSORED BY</span>
                <img src="https://storage.googleapis.com/msgsndr/Ro4CBx71xU0mNBfRkMkf/media/6886364cdcebe2e2aa6922ab.png" alt="Tom Sox schedule sponsor">
            </div>
        </div>

        <div class="schedule-controls">
            <button class="jump-to-game-btn" id="jump-to-game-btn" style="display: none;" aria-label="Jump to next game">
                <svg fill="currentColor" viewBox="0 0 16 16" height="1em" width="1em" aria-hidden="true">
                    <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8zm15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V4.5z"/>
                </svg>
                Jump to Next Game
            </button>

            <button class="schedule-btn" id="print-schedule-btn">
                <svg fill="currentColor" viewBox="0 0 16 16" height="1em" width="1em" aria-hidden="true">
                    <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                    <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2H5zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1z"/>
                </svg>
                Print
            </button>

            <a href="/team-records/year-by-year" class="historical-link">
                <svg fill="currentColor" viewBox="0 0 16 16" height="1em" width="1em" aria-hidden="true">
                    <path d="M8.5 5.5a.5.5 0 0 0-1 0v3.362l-1.429 2.38a.5.5 0 1 0 .858.515l1.5-2.5A.5.5 0 0 0 8.5 9V5.5z"/>
                    <path d="M6.5 0a.5.5 0 0 0 0 1H7v1.07a7.001 7.001 0 0 0-3.273 12.474l-.602.602a.5.5 0 0 0 .707.708l.746-.746A6.97 6.97 0 0 0 8 16a6.97 6.97 0 0 0 3.422-.892l.746.746a.5.5 0 0 0 .707-.708l-.601-.602A7.001 7.001 0 0 0 9 2.07V1h.5a.5.5 0 0 0 0-1h-3zm1.038 3.018a6.093 6.093 0 0 1 .924 0 6 6 0 1 1-.924 0zM0 3.5c0 .753.333 1.429.86 1.887A8.035 8.035 0 0 1 4.387 1.86 2.5 2.5 0 0 0 0 3.5zM13.5 1c-.753 0-1.429.333-1.887.86a8.035 8.035 0 0 1 3.527 3.527A2.5 2.5 0 0 0 13.5 1z"/>
                </svg>
                Year-by-Year Records
            </a>
        </div>
    </div>

    <div class="stats-bar" role="region" aria-label="Season statistics">
        <div class="stat-item"><span>OVERALL</span><strong id="stat-overall">--</strong></div>
        <div class="stat-item"><span>PCT</span><strong id="stat-pct">.---</strong></div>
        <div class="stat-item"><span>STREAK</span><strong id="stat-streak">--</strong></div>
        <div class="stat-item"><span>HOME</span><strong id="stat-home">--</strong></div>
        <div class="stat-item"><span>AWAY</span><strong id="stat-away">--</strong></div>
    </div>

    <div class="schedule-filter-bar" role="group" aria-label="Filter schedule">
        <button class="filter-btn active" data-filter="all">All Games</button>
        <button class="filter-btn" data-filter="home">Home</button>
        <button class="filter-btn" data-filter="away">Away</button>
        <button class="filter-btn" data-filter="upcoming">Upcoming</button>
        <button class="filter-btn" data-filter="results">Results</button>
    </div>

    <div class="sr-only" role="status" aria-live="polite" id="filter-announcement"></div>

    <div class="game-list" id="game-list-container">
        <p id="loading-message" role="status" aria-live="polite">Loading schedule...</p>
    </div>

</div>
