<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Section 1 | Charlottesville Tom Sox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: #4b5563;
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 500px;
            background: linear-gradient(135deg, rgba(27, 54, 93, 0.95) 0%, rgba(132, 189, 0, 0.85) 100%),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect fill="%231B365D" width="1200" height="600"/><path fill="%2384BD00" opacity="0.1" d="M0 300 Q300 200 600 300 T1200 300 V600 H0 Z"/></svg>') center/cover;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .hero-content {
            max-width: 900px;
            padding: 0 20px;
            z-index: 2;
        }

        .hero h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 72px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        .hero p {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.5px;
            opacity: 0.95;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* Main Content Section */
        .content-section {
            padding: 100px 20px;
            background: white;
        }

        .content-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Form Container - Ready for Your Form */
        .form-container {
            background: #f9fafb;
            border-radius: 12px;
            padding: 50px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero {
                min-height: 400px;
                background-attachment: scroll;
            }

            .hero h1 {
                font-size: 42px;
                letter-spacing: 2px;
            }

            .hero p {
                font-size: 18px;
            }

            .content-section {
                padding: 70px 20px;
            }

            .form-container {
                padding: 35px 25px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 36px;
            }

            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Contact Us</h1>
            <p>Have questions about the Tom Sox? Want to learn more about tickets, sponsorship opportunities, or our community programs? Send us a message and we'll get back to you as soon as possible.</p>
        </div>
    </section>
            </div>
        </div>
    </section>
</body>
</html>
