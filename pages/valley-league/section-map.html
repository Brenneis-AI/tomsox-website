<!--
  File: section-map.html
  Page: valley-league
  Section: Interactive Google Map showing all 12 VBL team locations with slide-in team panel
  Last Updated: 2026-02-21
-->

<section class="visit-section visit-vbl-map" id="vbl-map">
  <div class="visit-container">

    <div class="section-header">
      <h2 class="ts-section-headline">VALLEY BASEBALL LEAGUE</h2>
      <p class="ts-section-subheadline">Click any marker to explore all 12 VBL teams across Virginia's beautiful Shenandoah Valley</p>
    </div>

    <!-- Map Wrapper -->
    <div class="vbl-map-wrapper">

      <!-- Custom Tooltip (desktop hover) -->
      <div id="vbl-map-tooltip" class="vbl-custom-tooltip"></div>

      <!-- Slide-in Team Panel -->
      <div class="vbl-team-panel" id="vblTeamPanel">

        <div class="vbl-panel-header-actions" id="panelHeader">
          <button class="vbl-panel-close" id="panelClose" aria-label="Back to Map">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Map
          </button>
        </div>

        <div class="vbl-panel-content" id="panelContent">
          <!-- Populated by page.js -->
        </div>

        <div class="vbl-panel-footer">
          <button class="vbl-panel-directions-btn" id="panelDirections">
            Get Directions
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-left: 8px;">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </button>
        </div>

      </div>

      <!-- Google Maps Container -->
      <div class="vbl-map-container">
        <div id="vblMap"></div>
      </div>

    </div>
    <!-- /vbl-map-wrapper -->

  </div>
</section>
