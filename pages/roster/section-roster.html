<!--
  File: section-roster.html
  Page: Roster
  Section: Full roster display with player cards, filters, and coaching staff
  Last Updated: 2026-02-21
-->

<div class="roster-page-container">

    <!-- Roster Overlay Toggle System -->
    <div class="roster-overlay-content">
        <div>
            <h2>{{custom_values.current_season}} Roster Coming Soon</h2>
            <p>Stay tuned for our upcoming season lineup</p>
        </div>
    </div>
    <!-- End Roster Overlay -->

    <div class="roster-left-menu" id="player-list-menu">
        <div class="menu-header">
            <!-- Mobile controls inserted here by JS -->
        </div>
        <div class="player-list-wrapper" id="player-list-wrapper">
            <!-- Player links inserted here by JS -->
        </div>
        <div class="player-count" id="player-count"></div>
    </div>

    <div class="roster-right-content">
        <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" id="player-announcement"></div>

        <div id="player-cards-container">
            <div class="loading-container">
                <div class="roster-loader">
                    <svg class="roster-baseball" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="50" cy="50" r="46" fill="white" stroke="#e0e0e0" stroke-width="1.5"/>
                        <path d="M34,7 C16,28 16,72 34,93" fill="none" stroke="#CC3333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4"/>
                        <path d="M66,7 C84,28 84,72 66,93" fill="none" stroke="#CC3333" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4"/>
                    </svg>
                    <p class="roster-loading-text">LOADING THE LINEUP</p>
                </div>
            </div>
        </div>

        <div id="navigation-arrows">
            <button id="prev-btn" aria-label="View previous player">&larr;</button>
            <span class="player-indicator" id="player-indicator">1 / 1</span>
            <button id="next-btn" aria-label="View next player">&rarr;</button>
        </div>

        <!-- Coaching Staff Section -->
        <div id="coaching-staff-section" class="coaching-staff-section" style="display: none;">
            <h2 class="coaching-staff-header">Coaching Staff</h2>
            <div id="coaching-staff-grid" class="coaching-staff-grid">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

</div>
