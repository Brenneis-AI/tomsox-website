<!--
  File: section-photo-gallery.html
  Page: Home
  Section: Photo Gallery — 3D carousel with grid modal and lightbox viewer, fed from Google Sheets
  Last Updated: 2026-02-20
-->

<div class="photo-gallery-section">

    <h2 class="section-headline">Photo Galleries</h2>
    <p class="section-subtext">Browse photos from our games, events, and community moments.</p>

    <div class="carousel-container">
        <div class="carousel">
            <p>Loading Photo Galleries...</p>
        </div>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" id="gallery-prev-btn" aria-label="Previous gallery">Prev</button>
        <button class="nav-btn" id="gallery-next-btn" aria-label="Next gallery">Next</button>
    </div>

    <!-- Gallery modal — moved to body by JS to ensure correct stacking context -->
    <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalGalleryTitle">
        <div class="modal-content">
            <button class="modal-close-btn" aria-label="Close gallery">&#215;</button>
            <h2 class="modal-gallery-title" id="modalGalleryTitle">Gallery Title</h2>
            <div class="modal-grid"></div>
        </div>
    </div>

    <!-- Lightbox — moved to body by JS to ensure correct stacking context -->
    <div class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Full size image viewer">
        <div class="lightbox-content">
            <button class="lightbox-close-btn" aria-label="Close image viewer">&#215;</button>
            <button class="lightbox-nav-btn lightbox-prev-btn" aria-label="Previous image">&#10094;</button>
            <img src="" alt="" class="lightbox-image">
            <button class="lightbox-nav-btn lightbox-next-btn" aria-label="Next image">&#10095;</button>
        </div>
    </div>

</div>
