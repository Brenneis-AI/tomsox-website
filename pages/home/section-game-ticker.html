<!--
  File: section-game-ticker.html
  Page: Home
  Section: Game Ticker — horizontal grid of recent and upcoming games, fed from Google Sheets
  Last Updated: 2026-02-20
-->

<section class="ts-game-ticker" id="gameTicker">
    <div class="ticker-header">
        <h2>Recent &amp; Upcoming Games</h2>
        <a href="/schedule" class="ticker-view-all">View Full Schedule &rarr;</a>
    </div>

    <p class="ticker-subtitle"><em>Home games in green</em></p>

    <div class="ticker-controls">
        <button class="ticker-btn ticker-prev" id="tickerPrev" aria-label="Previous games">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <div class="ticker-track-wrapper">
            <div class="ticker-track" id="tickerTrack">
                <div class="ticker-loading">Loading games...</div>
            </div>
        </div>

        <button class="ticker-btn ticker-next" id="tickerNext" aria-label="Next games">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>

    <div class="ticker-dots" id="tickerDots"></div>
</section>
