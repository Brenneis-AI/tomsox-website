<section class="ts-hero-v2" id="home">
    <div class="ts-hero-video-container" id="videoContainer"></div>
    <div class="ts-hero-image" id="heroImage"></div>
    <div class="ts-hero-gradient"></div>

    <div class="ts-hero-content-v2">
        <!-- Next Game Badge — currently hidden via CSS -->
        <div class="ts-next-game-badge" id="nextGameBadge">
            <span class="badge-label">Next Game</span>
            <span class="badge-info" id="nextGameInfo">Loading...</span>
        </div>

        <!-- Hero Stats — currently hidden via CSS -->
        <div class="ts-hero-stats" id="heroStats"></div>
    </div>

    <!-- Floating side CTA — positioned outside content to avoid overlapping flyer text -->

        <a href="https://www.zeffy.com/en-us/ticketing/6th-annual-tom-sox-golf-tournament" class="ts-btn-secondary" target="_blank" rel="noopener noreferrer">RESERVE YOUR SPOT</a>

    <div class="ts-scroll-indicator" aria-hidden="true">
        <span>Scroll</span>
        <div class="scroll-arrow"></div>
    </div>
</section>
